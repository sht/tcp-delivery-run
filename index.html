<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deliveries</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e1db;
    --accent: #c2410c; --accent-text: #fff; --note: #fff4d6; --ok: #15803d; --late: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #22221f; --text: #ecebe7; --muted: #a09f99; --line: #34332f;
      --accent: #f97316; --accent-text: #161614; --note: #3d3420; --ok: #4ade80; --late: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 10px 14px; border-radius: 10px; text-decoration: none; display: inline-block; cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }

  #login { margin-top: 20vh; display: grid; gap: 12px; }
  #login input { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  #login-error { color: var(--accent); min-height: 1.4em; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .run { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .run h2 { font-size: 17px; margin: 0; }
  .routes { display: flex; gap: 8px; flex-wrap: wrap; }
  .stop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; }
  .num { background: var(--accent); color: var(--accent-text); border-radius: 999px; min-width: 26px; height: 26px; display: inline-grid; place-items: center; font-weight: 600; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  .late { color: var(--late); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card.done { opacity: .5; }
  .card h3 { margin: 0 0 2px; font-size: 17px; }
  .note { background: var(--note); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .actions label { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .actions input { width: 22px; height: 22px; accent-color: var(--ok); }
  .empty { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <form id="login" class="hidden">
    <h1>Deliveries</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Log in</button>
    <div id="login-error"></div>
  </form>

  <section id="app" class="hidden">
    <header>
      <div>
        <h1 id="courier"></h1>
        <div class="muted" id="updated"></div>
      </div>
      <div>
        <button id="refresh">Refresh</button>
        <button id="logout">Log out</button>
      </div>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" data-day="today" aria-selected="true">Today</button>
      <button role="tab" data-day="tomorrow" aria-selected="false">Tomorrow</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script type="module">
  import { planRun, formatTime } from '/lib/route.js';

  const $ = (id) => document.getElementById(id);
  const RUN_START = 10 * 60;
  const ROUTE_STOPS = 4;
  let data = null;
  let day = 'today';

  const store = {
    get() { try { return JSON.parse(localStorage.getItem('delivered')) || {}; } catch { return {}; } },
    set(value) { try { localStorage.setItem('delivered', JSON.stringify(value)); } catch {} },
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mapsSearch = (address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;

  function routeLinks(orders) {
    const links = [];
    for (let i = 0; i < orders.length; i += ROUTE_STOPS) {
      const stops = orders.slice(i, i + ROUTE_STOPS).map((o) => o.delivery_address);
      const destination = stops.pop();
      let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(destination)}`;
      if (stops.length) url += `&waypoints=${encodeURIComponent(stops.join('|'))}`;
      links.push(url);
    }
    return links;
  }

  function showLogin() {
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('password').focus();
  }

  async function load() {
    const res = await fetch('/api/orders', { cache: 'no-store' });
    if (res.status === 401) return showLogin();
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    if (!res.ok) { $('list').innerHTML = '<p class="empty">Could not load orders. Try Refresh.</p>'; return; }
    data = await res.json();
    $('courier').textContent = data.courier || 'Deliveries';
    $('updated').textContent = `Updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
    render();
  }

  function render() {
    const delivered = store.get();
    const date = data[day];
    const orders = data.orders.filter((o) => o.fulfillment_date === date);
    if (!orders.length) { $('list').innerHTML = `<p class="empty muted">No orders for ${day} (${date}).</p>`; return; }

    const open = orders.filter((o) => !delivered[o.order_number]);
    const done = orders.filter((o) => delivered[o.order_number]);

    // Re-plan from the last delivered stop, otherwise from the kitchen at 10:00.
    const last = done.filter((o) => o.lat != null).sort((a, b) => delivered[b.order_number] - delivered[a.order_number])[0];
    const weekday = new Date(`${date}T12:00:00Z`).getUTCDay();
    const plan = planRun({
      start: last || data.kitchen,
      startTime: day === 'today' ? Math.max(RUN_START, nowMinutes()) : RUN_START,
      stops: open,
      useWindows: weekday !== 0 && weekday !== 6,
    });

    const routes = routeLinks(plan.stops).map((url, i) =>
      `<a class="btn primary" target="_blank" rel="noopener" href="${esc(url)}">${plan.stops.length <= ROUTE_STOPS ? 'Route' : `Stops ${i * ROUTE_STOPS + 1}–${Math.min((i + 1) * ROUTE_STOPS, plan.stops.length)}`}</a>`);
    const lead = !open.length ? 'All delivered'
      : last ? `${open.length} of ${orders.length} open`
      : `Leave kitchen at ${formatTime(plan.departure)}`;

    $('list').innerHTML = `
      <div class="run">
        <h2>${lead}</h2>
        <div class="routes">${routes.join('')}</div>
      </div>
      ${plan.stops.map((o, i) => card(o, i + 1, false)).join('')}
      ${done.map((o) => card(o, null, true)).join('')}`;
  }

  function nowMinutes() {
    const [h, m] = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }).split(':');
    return h * 60 + +m;
  }

  function card(o, num, done) {
    const eta = o.eta == null ? (o.lat == null ? '<span class="late">No location</span>' : '')
      : `<span class="${o.late ? 'late' : ''}">~${formatTime(o.eta)}${o.late ? ' late' : ''}</span>`;
    return `
      <article class="card${done ? ' done' : ''}">
        ${done ? '' : `<div class="stop"><span class="num">${num}</span>${o.delivery_window ? `<span class="badge">${esc(o.delivery_window)}</span>` : ''}<span>${eta}</span></div>`}
        <h3>${esc(o.customer_name)}</h3>
        <div>${esc(o.delivery_address)}</div>
        <div class="muted">${[o.delivery_district, o.building_company_name, o.order_number].filter(Boolean).map(esc).join(' · ')}</div>
        ${o.delivery_note ? `<div class="note">${esc(o.delivery_note)}</div>` : ''}
        <div class="actions">
          ${o.customer_phone ? `<a class="btn" href="tel:${esc(o.customer_phone)}">Call</a>` : ''}
          <a class="btn" target="_blank" rel="noopener" href="${esc(mapsSearch(o.delivery_address))}">Navigate</a>
          <label><input type="checkbox" data-order="${esc(o.order_number)}" ${done ? 'checked' : ''}> Delivered</label>
        </div>
      </article>`;
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-error').textContent = '';
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('password').value }),
    });
    if (!res.ok) { $('login-error').textContent = 'Wrong password'; return; }
    $('password').value = '';
    load();
  });

  $('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    data = null;
    $('list').innerHTML = '';
    showLogin();
  });

  $('refresh').addEventListener('click', load);

  document.querySelector('.tabs').addEventListener('click', (e) => {
    if (!e.target.dataset.day) return;
    day = e.target.dataset.day;
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.day === day));
    if (data) render();
  });

  $('list').addEventListener('change', (e) => {
    const id = e.target.dataset.order;
    if (!id) return;
    const delivered = store.get();
    if (e.target.checked) delivered[id] = Date.now(); else delete delivered[id];
    store.set(delivered);
    render();
  });

  load();
</script>
</body>
</html>
